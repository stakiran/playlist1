<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Playlist</title>
<style>
  :root{
    --bg:#0e0f12;
    --panel:#16181d;
    --panel-hover:#1e2128;
    --line:#262a33;
    --text:#e8e9ec;
    --text-dim:#8b8f9a;
    --accent:#f2b33d;
    --accent-dim:rgba(242,179,61,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.5;
  }
  .app{
    display:grid;
    grid-template-columns:1fr 360px;
    gap:0;
    height:100vh;
  }
  /* ---- player side ---- */
  .stage{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .video-wrap{
    position:relative;
    flex:1;
    min-height:0;
    background:#000;
  }
  .video-wrap iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
  }
  .now-bar{
    padding:14px 20px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:16px;
  }
  .now-info{min-width:0;flex:1}
  .now-label{
    font-size:11px;letter-spacing:.12em;color:var(--accent);
    text-transform:uppercase;
  }
  .now-title{
    font-size:15px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .controls{display:flex;gap:8px;flex-shrink:0}
  button{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  button:hover{background:var(--panel-hover)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.on{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent);
  }
  /* ---- playlist side ---- */
  .list{
    border-left:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .list-head{
    padding:16px 20px 12px;
    border-bottom:1px solid var(--line);
  }
  .list-head h1{font-size:16px;font-weight:700}
  .list-head p{font-size:12px;color:var(--text-dim)}
  .items{overflow-y:auto;flex:1}
  .item{
    display:flex;
    gap:12px;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    align-items:center;
    transition:background .12s;
  }
  .item:hover{background:var(--panel-hover)}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .item.active{background:var(--accent-dim)}
  .thumb{
    width:96px;aspect-ratio:16/9;
    border-radius:6px;object-fit:cover;
    background:#000;flex-shrink:0;
  }
  .item-body{min-width:0;flex:1}
  .item-idx{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;color:var(--text-dim);
  }
  .item.active .item-idx{color:var(--accent)}
  .item-title{
    font-size:13px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  /* playing equalizer */
  .eq{display:none;gap:2px;align-items:flex-end;height:14px;flex-shrink:0}
  .item.active .eq{display:flex}
  .eq span{
    width:3px;background:var(--accent);border-radius:1px;
    animation:eq 1s ease-in-out infinite;
  }
  .eq span:nth-child(2){animation-delay:.25s}
  .eq span:nth-child(3){animation-delay:.5s}
  @keyframes eq{
    0%,100%{height:4px}
    50%{height:14px}
  }
  @media (prefers-reduced-motion:reduce){
    .eq span{animation:none;height:10px}
  }
  /* ---- mobile ---- */
  @media (max-width:820px){
    .app{
      grid-template-columns:1fr;
      grid-template-rows:auto 1fr;
      height:100vh;
    }
    .video-wrap{flex:none;aspect-ratio:16/9}
    .list{border-left:0;border-top:1px solid var(--line)}
    .now-bar{flex-wrap:wrap}
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage">
    <div class="video-wrap"><div id="player"></div></div>
    <div class="now-bar">
      <div class="now-info">
        <div class="now-label">Now Playing</div>
        <div class="now-title" id="nowTitle">–</div>
      </div>
      <div class="controls">
        <button id="btnPrev" title="前へ">⏮ 前へ</button>
        <button id="btnNext" title="次へ">次へ ⏭</button>
        <button id="btnShuffle" title="シャッフル">🔀 シャッフル</button>
        <button id="btnLoop" title="リピート">🔁 リピート</button>
      </div>
    </div>
  </div>

  <aside class="list">
    <div class="list-head">
      <h1>My Playlist</h1>
      <p id="countLabel"></p>
    </div>
    <div class="items" id="items"></div>
  </aside>
</div>

// --- URL から動画IDを抜き出す ---
function extractId(url){
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

const playlist = VIDEOS.map(v => {
  const url = typeof v === "string" ? v : v.url;
  const id = extractId(url);
  return { id, title: (typeof v === "object" && v.title) ? v.title : null, custom: typeof v === "object" && !!v.title };
}).filter(v => v.id);

let current = 0;
let shuffle = false;
let loop = true;
let order = playlist.map((_, i) => i);
let player = null;
let ready = false;

// --- YouTube IFrame API 読み込み ---
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player("player", {
    videoId: playlist[current].id,
    playerVars: { rel: 0, playsinline: 1 },
    events: {
      onReady: () => { ready = true; },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) next();
      }
    }
  });
};

// --- 再生制御 ---
function play(index){
  current = index;
  if (ready) player.loadVideoById(playlist[current].id);
  render();
}
function posInOrder(){ return order.indexOf(current); }
function next(){
  let p = posInOrder() + 1;
  if (p >= order.length){
    if (!loop) return;
    if (shuffle) reshuffle();
    p = 0;
  }
  play(order[p]);
}
function prev(){
  let p = posInOrder() - 1;
  if (p < 0) p = loop ? order.length - 1 : 0;
  play(order[p]);
}
function reshuffle(){
  order = playlist.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
}

// --- UI ---
const itemsEl = document.getElementById("items");
const nowTitleEl = document.getElementById("nowTitle");

function titleOf(v){ return v.title || v.id; }

function render(){
  nowTitleEl.textContent = titleOf(playlist[current]);
  document.title = titleOf(playlist[current]) + " – My Playlist";
  [...itemsEl.children].forEach((el, i) => {
    el.classList.toggle("active", i === current);
  });
  document.getElementById("btnShuffle").classList.toggle("on", shuffle);
  document.getElementById("btnLoop").classList.toggle("on", loop);
}

function buildList(){
  document.getElementById("countLabel").textContent = playlist.length + " 本の動画";
  playlist.forEach((v, i) => {
    const el = document.createElement("div");
    el.className = "item";
    el.tabIndex = 0;
    el.innerHTML = `
      <img class="thumb" loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="">
      <div class="item-body">
        <div class="item-idx">${String(i + 1).padStart(2, "0")}</div>
        <div class="item-title">${v.id}</div>
      </div>
      <div class="eq"><span></span><span></span><span></span></div>`;
    el.addEventListener("click", () => play(i));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(i); } });
    itemsEl.appendChild(el);
  });
}

// --- タイトル自動取得（oEmbed、失敗したらIDのまま） ---
async function fetchTitles(){
  await Promise.all(playlist.map(async (v, i) => {
    if (v.custom) { applyTitle(i); return; }
    try {
      const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${v.id}&format=json`);
      if (r.ok){
        const j = await r.json();
        v.title = j.title;
      }
    } catch(e){ /* オフライン等 → IDを表示 */ }
    applyTitle(i);
  }));
  render();
}
function applyTitle(i){
  const el = itemsEl.children[i]?.querySelector(".item-title");
  if (el) el.textContent = titleOf(playlist[i]);
}

// --- ボタン & キーボード ---
document.getElementById("btnNext").addEventListener("click", next);
document.getElementById("btnPrev").addEventListener("click", prev);
document.getElementById("btnShuffle").addEventListener("click", () => {
  shuffle = !shuffle;
  if (shuffle) reshuffle(); else order = playlist.map((_, i) => i);
  render();
});
document.getElementById("btnLoop").addEventListener("click", () => { loop = !loop; render(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && e.shiftKey) next();
  if (e.key === "ArrowLeft" && e.shiftKey) prev();
});

buildList();
render();
fetchTitles();
</script>
